<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>02강 | 청소년의 발달 - 문제 풀이</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    :root{
      --mint:#47BFAE; --mint2:#59C7B7;
      --sky:#63B6FF;  --sky2:#8CCBFF;
      --orange:#FF7A3D;
      --text:#2F3A40;  --muted:#7A8A93;
      --line:#E6ECEF;  --bg:#F0F4F8;
      --card:#fff;
      --green:#2ECC8F; --red:#E55A6E;
      --seg-empty:#DEE5EB;
    }
    *{ box-sizing:border-box; margin:0; padding:0; }
    html,body{ height:100%; font-family:"Noto Sans KR",sans-serif; color:var(--text); }

    /* ── MODE BAR ── */
    .mode-bar{
      position:sticky; top:0; z-index:200;
      background:rgba(240,244,248,.95);
      backdrop-filter:blur(10px);
      border-bottom:1px solid var(--line);
      padding:9px 16px;
      display:flex; justify-content:center; align-items:center;
    }
    .mode-toggle{
      display:flex; background:#DDE3EA; border-radius:999px; padding:4px; gap:4px;
    }
    .mode-btn{
      border:none; border-radius:999px; padding:8px 20px;
      font-size:13px; font-weight:700; cursor:pointer;
      background:transparent; color:var(--muted);
      font-family:inherit; transition:all .2s;
    }
    .mode-btn.active{
      background:#fff; color:var(--text);
      box-shadow:0 2px 8px rgba(0,0,0,.12);
    }

    /* ════════════════════════════
       CARD MODE
    ════════════════════════════ */
    #cardMode{
      min-height:calc(100vh - 49px);
      background:linear-gradient(145deg,#E3F2EF 0%,#EBF3FF 55%,#F0EDF8 100%);
      display:flex; flex-direction:column;
    }
    #listMode{ display:none; }

    /* ── card top bar ── */
    .card-topbar{
      padding:14px 20px 0;
      display:flex; align-items:center; justify-content:space-between; gap:12px;
      flex-wrap:wrap;
    }
    .ctb-pill{
      display:inline-flex; align-items:center; gap:6px;
      padding:6px 14px; border-radius:999px;
      background:linear-gradient(90deg,var(--mint),var(--mint2));
      color:#fff; font-weight:700; font-size:12px;
      box-shadow:0 4px 12px rgba(71,191,174,.22);
      white-space:nowrap;
    }
    .ctb-counter{
      font-size:13px; font-weight:700; color:var(--muted);
      white-space:nowrap;
    }
    .ctb-counter b{ color:var(--text); }

    /* ── Segment progress bar ── */
    .seg-wrap{ padding:10px 20px 0; }
    .seg-bar{
      display:flex; gap:3px; height:10px;
    }
    .seg{
      flex:1; border-radius:4px;
      background:var(--seg-empty);
      transition:background .3s ease;
      cursor:pointer;
      position:relative;
    }
    .seg:hover::after{
      content:attr(data-tip);
      position:absolute; bottom:130%; left:50%;
      transform:translateX(-50%);
      background:rgba(47,58,64,.88); color:#fff;
      font-size:11px; font-weight:700;
      padding:3px 8px; border-radius:6px;
      white-space:nowrap; pointer-events:none;
      z-index:10;
    }
    .seg.s-current{ background:var(--mint); box-shadow:0 0 0 2px rgba(71,191,174,.4); }
    .seg.s-answered{ background:var(--sky2); }
    .seg.s-correct{ background:var(--green); }
    .seg.s-wrong{ background:var(--red); }

    .seg-legend{
      display:flex; gap:14px; flex-wrap:wrap; margin-top:7px;
      font-size:11px; font-weight:700; color:var(--muted);
      align-items:center;
    }
    .seg-legend span{ display:flex; align-items:center; gap:5px; }
    .ldot{ width:10px; height:10px; border-radius:3px; flex-shrink:0; }

    /* ── card stage ── */
    .card-stage{
      flex:1; display:flex; align-items:flex-start;
      justify-content:center; padding:16px 16px 36px;
    }
    .card-frame{
      width:100%; max-width:660px; position:relative;
    }
    .card-frame::after{
      content:""; position:absolute;
      left:50%; transform:translateX(-50%);
      width:calc(100% - 22px); height:100%;
      bottom:-10px; z-index:0;
      background:#fff; border-radius:22px;
      box-shadow:0 4px 18px rgba(0,0,0,.07);
      border:1px solid rgba(0,0,0,.05);
      opacity:.55;
    }
    .card-frame::before{
      content:""; position:absolute;
      left:50%; transform:translateX(-50%);
      width:calc(100% - 42px); height:100%;
      bottom:-18px; z-index:-1;
      background:#fff; border-radius:22px;
      opacity:.30;
    }
    .card{
      position:relative; z-index:1;
      background:#fff; border-radius:22px;
      box-shadow:0 16px 48px rgba(24,39,75,.13),0 3px 12px rgba(24,39,75,.07);
      padding:28px 26px 22px;
      border:1px solid rgba(230,236,239,.9);
    }
    .card::before{
      content:""; position:absolute;
      top:0; left:0; right:0; height:4px;
      background:linear-gradient(90deg,var(--mint),var(--sky));
      border-radius:22px 22px 0 0;
    }

    .cq-no{
      display:inline-flex; align-items:center; gap:5px;
      padding:5px 13px; border-radius:999px;
      background:linear-gradient(135deg,rgba(99,182,255,.14),rgba(71,191,174,.11));
      border:1px solid rgba(99,182,255,.24);
      color:#2C6DD2; font-weight:900; font-size:12.5px;
      margin-bottom:16px;
    }
    .cq-text{
      font-size:16px; font-weight:800; letter-spacing:-.3px;
      white-space:pre-wrap; line-height:1.7; margin-bottom:18px;
    }
    .cq-choices{ display:flex; flex-direction:column; gap:9px; }

    label.cc{
      display:flex; align-items:flex-start; gap:11px;
      padding:12px 15px; border-radius:15px;
      border:2px solid var(--line); background:#FAFBFC;
      cursor:pointer; transition:all .17s; user-select:none;
    }
    label.cc:hover:not(.cc-locked){
      border-color:var(--mint);
      background:rgba(71,191,174,.06);
      transform:translateY(-1px);
      box-shadow:0 4px 12px rgba(71,191,174,.14);
    }
    label.cc.cc-selected{
      border-color:var(--sky);
      background:linear-gradient(135deg,rgba(99,182,255,.09),rgba(71,191,174,.06));
      box-shadow:0 3px 12px rgba(99,182,255,.17);
    }
    label.cc.cc-locked{ cursor:default; }
    label.cc.cc-correct{
      border-color:rgba(46,204,143,.8)!important;
      background:rgba(46,204,143,.10)!important;
      box-shadow:0 0 0 2px rgba(46,204,143,.25)!important;
    }
    label.cc.cc-wrong{
      border-color:rgba(229,90,110,.7)!important;
      background:rgba(229,90,110,.09)!important;
      box-shadow:0 0 0 2px rgba(229,90,110,.2)!important;
    }
    label.cc input[type=radio]{ display:none; }
    .cc-num{
      width:26px; height:26px; border-radius:50%;
      background:rgba(99,182,255,.12);
      display:flex; align-items:center; justify-content:center;
      font-size:12.5px; font-weight:900; color:#2C6DD2;
      flex-shrink:0;
    }
    .cc-txt{ font-size:14px; color:var(--text); line-height:1.55; }

    .cq-result{
      margin-top:16px; padding:15px; border-radius:15px;
      display:none; animation:fadeUp .28s ease;
    }
    .cq-result.correct{
      background:linear-gradient(135deg,rgba(46,204,143,.11),rgba(46,204,143,.05));
      border:1.5px solid rgba(46,204,143,.35);
    }
    .cq-result.wrong{
      background:linear-gradient(135deg,rgba(229,90,110,.09),rgba(229,90,110,.04));
      border:1.5px solid rgba(229,90,110,.28);
    }
    .cqr-badge{
      font-size:14px; font-weight:900; margin-bottom:7px;
      display:flex; align-items:center; gap:6px;
    }
    .cqr-badge.correct{ color:#138A60; }
    .cqr-badge.wrong{ color:#C0334A; }
    .cqr-exp{ font-size:13.5px; line-height:1.65; color:var(--text); }
    .cqr-cor{ margin-top:7px; font-size:13px; font-weight:700; color:#138A60; }

    @keyframes fadeUp{
      from{opacity:0;transform:translateY(8px);}
      to{opacity:1;transform:translateY(0);}
    }

    .cq-controls{
      display:flex; align-items:center; justify-content:space-between;
      margin-top:20px; gap:10px; flex-wrap:wrap;
    }
    .btn-nav{
      display:flex; align-items:center; gap:7px;
      padding:11px 18px; border-radius:13px;
      border:2px solid var(--line); background:#fff;
      color:var(--text); font-weight:900; font-size:14px;
      cursor:pointer; transition:all .15s; font-family:inherit;
    }
    .btn-nav:hover:not(:disabled){
      border-color:var(--mint); background:rgba(71,191,174,.06);
    }
    .btn-nav:disabled{ opacity:.32; cursor:not-allowed; }
    .btn-check{
      flex:1; max-width:190px;
      padding:12px 18px; border-radius:13px; border:none;
      background:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,0)),
                linear-gradient(90deg,var(--mint),var(--mint2));
      color:#fff; font-weight:900; font-size:14px;
      cursor:pointer; font-family:inherit;
      box-shadow:0 7px 18px rgba(71,191,174,.28);
      transition:all .15s;
    }
    .btn-check:hover:not(:disabled){ filter:brightness(1.05); transform:translateY(-1px); }
    .btn-check:disabled{ opacity:.4; cursor:not-allowed; transform:none; }

    .score-card{ text-align:center; padding:16px 8px; }
    .sc-big{
      font-size:68px; font-weight:900; line-height:1;
      background:linear-gradient(135deg,var(--mint),var(--sky));
      -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
      margin:12px 0 6px;
    }
    .sc-sub{ font-size:15px; color:var(--muted); font-weight:700; margin-bottom:20px; }
    .sc-grid{
      display:grid; grid-template-columns:repeat(3,1fr);
      gap:9px; margin-bottom:20px;
    }
    .sc-item{
      padding:13px 8px; border-radius:14px;
      border:1px solid var(--line); background:#FAFBFC;
    }
    .sc-item .v{ font-size:22px; font-weight:900; color:var(--text); }
    .sc-item .l{ font-size:11px; color:var(--muted); font-weight:700; margin-top:2px; }
    .sc-item.good .v{ color:#138A60; }
    .sc-item.bad .v{ color:#C0334A; }
    .sc-actions{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
    .sc-actions .btn-check{ max-width:none; padding:12px 22px; }

    /* ══════════════════════════
       LIST MODE
    ══════════════════════════ */
    #listMode{
      background:var(--bg);
      min-height:calc(100vh - 49px);
    }
    .lwrap{ max-width:980px; margin:0 auto; padding:20px 16px 80px; }
    .hero{
      position:relative; background:#fff;
      border:1px solid var(--line); border-radius:20px;
      box-shadow:0 8px 26px rgba(24,39,75,.10);
      padding:24px 20px 16px; text-align:center;
    }
    .l-pill{
      display:inline-flex; align-items:center; gap:7px;
      padding:7px 14px; border-radius:999px;
      background:linear-gradient(90deg,var(--mint),var(--mint2));
      color:#fff; font-weight:700; font-size:12.5px;
      box-shadow:0 5px 14px rgba(71,191,174,.22);
    }
    .hero h1{ margin:12px 0 5px; font-size:26px; font-weight:800; letter-spacing:-.5px; }
    .uline{ width:38px; height:4px; border-radius:999px; background:var(--orange); margin:9px auto 0; }
    .total-pill{
      position:absolute; top:14px; right:14px;
      padding:7px 12px; border-radius:999px; background:#EEF2F4;
      border:1px solid var(--line); color:var(--muted); font-weight:700; font-size:12.5px;
    }
    .lsection{
      margin-top:16px; background:#fff;
      border:1px solid var(--line); border-radius:20px;
      box-shadow:0 5px 16px rgba(24,39,75,.08); overflow:hidden;
    }
    .lsec-head{
      background:#DFF3F0; padding:13px 17px;
      font-weight:800; font-size:17px; letter-spacing:-.2px;
    }
    .lsec-body{ padding:16px; }
    .lq{
      background:#fff; border:1px solid var(--line);
      border-radius:15px; padding:13px; margin-bottom:11px;
    }
    .lq-top{ display:flex; align-items:flex-start; gap:9px; }
    .lq-no{
      width:44px; height:28px; border-radius:999px;
      background:rgba(99,182,255,.13); border:1px solid rgba(99,182,255,.22);
      color:#2C6DD2; display:flex; align-items:center; justify-content:center;
      font-weight:900; font-size:12.5px; flex-shrink:0;
    }
    .lq-text{ margin:0; font-weight:800; white-space:pre-wrap; letter-spacing:-.2px; font-size:14.5px; }
    .lchoices{ margin-top:9px; display:grid; gap:7px; }
    label.lchoice{
      display:flex; gap:9px; align-items:flex-start;
      padding:9px 11px; border-radius:13px;
      border:1px solid var(--line); background:#F9FBFC;
      cursor:pointer; transition:background .14s,border-color .14s; user-select:none;
    }
    label.lchoice:hover{ background:rgba(71,191,174,.07); border-color:rgba(71,191,174,.22); }
    input[type=radio]{ accent-color:var(--mint); }
    .lc-text{ color:var(--text); font-weight:400; font-size:14px; }
    .l-actions{ display:flex; gap:9px; flex-wrap:wrap; margin-top:13px; }
    button.lbtn{
      border:0; border-radius:13px; padding:11px 13px;
      font-weight:900; cursor:pointer; font-family:inherit; font-size:13.5px;
      transition:transform .05s,filter .15s;
    }
    button.lbtn:active{ transform:translateY(1px); }
    .lbtn-primary{
      background:linear-gradient(180deg,rgba(255,255,255,.5),rgba(255,255,255,0)),
                 linear-gradient(90deg,var(--mint),var(--mint2));
      color:#fff; box-shadow:0 8px 16px rgba(71,191,174,.2);
    }
    .lbtn-blue{
      background:linear-gradient(180deg,rgba(255,255,255,.25),rgba(255,255,255,0)),
                 linear-gradient(90deg,#3A8FE8,var(--sky));
      color:#fff; box-shadow:0 7px 16px rgba(44,109,210,.2);
    }
    .lresult{
      margin-top:13px; padding:13px; border-radius:14px;
      border:1px solid var(--line); background:rgba(71,191,174,.08); display:none;
    }
    .lresult h3{ margin:0 0 5px; font-size:15px; }
    .lresult .meta{ color:var(--muted); font-size:12.5px; font-weight:700; }
    .lbadge{
      display:inline-flex; align-items:center; gap:7px;
      padding:5px 9px; border-radius:999px; font-size:11.5px;
      border:1px solid var(--line); background:#F6F8FA;
      color:var(--muted); font-weight:900;
    }
    .lbadge.good{ color:#138A60; border-color:rgba(21,138,103,.2); background:rgba(71,191,174,.10); }
    .lbadge.bad{ color:#C0334A; border-color:rgba(200,58,82,.18); background:rgba(255,122,61,.10); }
    label.lchoice.lhl-correct{
      outline:2px solid rgba(71,191,174,.5);
      border-color:rgba(71,191,174,.35)!important; background:rgba(71,191,174,.10)!important;
    }
    label.lchoice.lhl-wrong{
      outline:2px solid rgba(200,58,82,.5);
      border-color:rgba(200,58,82,.25)!important; background:rgba(255,122,61,.09)!important;
    }
    .linline-review{
      margin-top:11px; padding:11px; border-radius:13px;
      border:1px solid var(--line); background:rgba(99,182,255,.08); display:none;
    }
    .linline-review .lrow{ display:flex; align-items:flex-start; justify-content:space-between; gap:9px; flex-wrap:wrap; }
    .linline-review .lexp{ margin-top:7px; white-space:pre-wrap; color:var(--text); font-weight:400; font-size:13.5px; }
    .lfab{
      position:fixed; right:15px; bottom:15px;
      display:flex; flex-direction:column; gap:9px; z-index:50;
    }
    .lfab button{
      padding:11px 13px; border-radius:999px;
      box-shadow:0 5px 16px rgba(24,39,75,.12);
    }

    @media(max-width:520px){
      .cq-text{ font-size:14.5px; }
      .cc-txt{ font-size:13.5px; }
      .sc-big{ font-size:52px; }
      .card{ padding:22px 16px 18px; }
      .hero h1{ font-size:20px; }
      .seg-legend{ gap:9px; font-size:10.5px; }
    }
    @media(max-width:360px){
      .btn-nav span{ display:none; }
    }
  </style>
</head>
<body>

<!-- MODE BAR -->
<div class="mode-bar">
  <div class="mode-toggle">
    <button class="mode-btn active" id="modeBtnCard" onclick="setMode('card')">🃏 한 문제씩 풀기</button>
    <button class="mode-btn" id="modeBtnList" onclick="setMode('list')">📋 전체 목록형</button>
  </div>
</div>

<!-- ═══════ CARD MODE ═══════ -->
<div id="cardMode">
  <div class="card-topbar">
    <div class="ctb-pill">02강 · 청소년의 발달</div>
    <div class="ctb-counter">문항 <b id="ctbCur">1</b> / <b id="ctbTot">15</b></div>
  </div>

  <div class="seg-wrap">
    <div class="seg-bar" id="segBar"></div>
    <div class="seg-legend">
      <span><span class="ldot" style="background:var(--mint)"></span>현재</span>
      <span><span class="ldot" style="background:var(--sky2)"></span>선택 완료</span>
      <span><span class="ldot" style="background:var(--green)"></span>정답</span>
      <span><span class="ldot" style="background:var(--red)"></span>오답</span>
      <span><span class="ldot" style="background:var(--seg-empty)"></span>미완료</span>
    </div>
  </div>

  <div class="card-stage">
    <div class="card-frame">
      <div class="card" id="mainCard"></div>
    </div>
  </div>
</div>

<!-- ═══════ LIST MODE ═══════ -->
<div id="listMode">
  <div class="lwrap">
    <header class="hero">
      <div class="l-pill">[내신만점] 가정 ① (2025)</div>
      <div class="total-pill">총 <b id="lTotalCount">0</b>문항</div>
      <h1>02강. 청소년의 발달 - 학교 시험 정복 문제</h1>
      <div class="uline"></div>
    </header>
    <section class="lsection">
      <div class="lsec-head">문제 풀이</div>
      <div class="lsec-body">
        <form id="listForm"></form>
        <div class="l-actions">
          <button class="lbtn lbtn-primary" id="lBtnGrade">결과 확인하기</button>
          <button class="lbtn lbtn-blue" id="lBtnShowAns" style="display:none">정답 확인하기</button>
        </div>
        <div class="lresult" id="lResultBox">
          <h3 id="lResultTitle"></h3>
          <div class="meta" id="lResultMeta"></div>
        </div>
      </div>
    </section>
  </div>
  <div class="lfab">
    <button class="lbtn lbtn-blue" onclick="window.scrollTo({top:0,behavior:'smooth'})">맨 위로</button>
    <button class="lbtn lbtn-blue" onclick="listReset()">다시 풀기</button>
  </div>
</div>

<script>
/* ══════════════════════════
   DATA
══════════════════════════ */
const C = ["①","②","③","④","⑤"];
const QD = [
  {no:"01",q:"성장 급등의 특징에 대한 설명으로 옳지 않은 것은?",
   ch:["얼굴 길이가 짧아진다.","근육과 골격이 발달한다.","키와 몸무게가 급격히 증가한다.","머리가 차지하는 비율이 줄어든다.","손과 발, 팔다리, 몸통 순으로 발달한다."],
   ans:0,exp:"청소년은 성장 급등을 경험하며 몸에서 머리가 차지하는 비율이 줄어들고, 얼굴 모양이 길어진다."},
  {no:"02",q:"다음 설명에 해당하는 것은?\n청소년기에 성호르몬이 많이 분비되면서 남성과 여성의 신체적 특징이 뚜렷하게 구분되는 현상이다.",
   ch:["성장기","2차 성징","성장 급등","신체 발달","성장의 개인차"],
   ans:1,exp:"청소년기에는 성호르몬 분비에 따라 남성과 여성의 신체적 특징이 뚜렷하게 구분되는 2차 성징을 경험한다."},

function esc(s){
  return String(s)
    .replaceAll("&","&amp;").replaceAll("<","&lt;")
    .replaceAll(">","&gt;").replaceAll('"',"&quot;");
}

/* ══════════════════════════
   MODE SWITCH
══════════════════════════ */
function setMode(m){
  document.getElementById('cardMode').style.display = m==='card' ? 'flex' : 'none';
  document.getElementById('listMode').style.display = m==='list' ? 'block' : 'none';
  document.getElementById('modeBtnCard').classList.toggle('active', m==='card');
  document.getElementById('modeBtnList').classList.toggle('active', m==='list');
}

/* ══════════════════════════
   CARD MODE STATE & LOGIC
══════════════════════════ */
let cidx  = 0;
let cans  = new Array(QD.length).fill(null);
let cchk  = new Array(QD.length).fill(false);
let cdone = false;

function buildSegBar(){
  const bar = document.getElementById('segBar');
  bar.innerHTML = '';
  QD.forEach((_,i)=>{
    const s = document.createElement('div');
    s.className = 'seg';
    s.setAttribute('data-tip', `${i+1}번`);
    s.onclick = ()=>{ if(!cdone){ cidx=i; renderCard(); } };
    bar.appendChild(s);
  });
}

function updateSeg(){
  const segs = document.querySelectorAll('.seg');
  segs.forEach((s,i)=>{
    s.className = 'seg';
    if(cchk[i]){
      s.classList.add(cans[i]===QD[i].ans ? 's-correct' : 's-wrong');
    } else if(cans[i] !== null){
      s.classList.add('s-answered');
    }
    if(i === cidx && !cdone) s.classList.add('s-current');
  });
  document.getElementById('ctbCur').textContent = cdone ? QD.length : cidx+1;
  document.getElementById('ctbTot').textContent = QD.length;
}

function renderCard(){
  if(cdone){ renderScore(); return; }
  updateSeg();

  const item  = QD[cidx];
  const ua    = cans[cidx];
  const chkd  = cchk[cidx];
  const isLast = cidx === QD.length-1;

  const choicesHTML = item.ch.map((c,ci)=>{
    let cls = 'cc';
    if(ua === ci) cls += ' cc-selected';
    if(chkd){
      cls += ' cc-locked';
      if(ci === item.ans)   cls += ' cc-correct';
      else if(ci === ua)    cls += ' cc-wrong';
    }
    return `<label class="${cls}" data-ci="${ci}">
      <input type="radio" name="cq" value="${ci}" ${ua===ci?'checked':''}>
      <div class="cc-num">${C[ci]}</div>
      <div class="cc-txt">${esc(c)}</div>
    </label>`;
  }).join('');

  let resultHTML = '';
  if(chkd){
    const ok = ua === item.ans;
    const corTxt = `${C[item.ans]} ${item.ch[item.ans]}`;
    resultHTML = `<div class="cq-result ${ok?'correct':'wrong'}" style="display:block">
      <div class="cqr-badge ${ok?'correct':'wrong'}">${ok?'✅ 정답입니다!':'❌ 오답입니다'}</div>
      <div class="cqr-exp">${esc(item.exp)}</div>
      ${!ok ? `<div class="cqr-cor">✔ 정답: ${esc(corTxt)}</div>` : ''}
    </div>`;
  }

  const checkLabel   = chkd ? (isLast ? '결과 보기 →' : '다음 문제 →') : '정답 확인';
  const checkDisabled = (!chkd && ua===null) ? 'disabled' : '';

  document.getElementById('mainCard').innerHTML = `
    <div class="cq-no">문제 ${item.no}</div>
    <div class="cq-text">${esc(item.q)}</div>
    <div class="cq-choices">${choicesHTML}</div>
    ${resultHTML}
    <div class="cq-controls">
      <button class="btn-nav" ${cidx===0?'disabled':''} onclick="cardNav(-1)">← <span>이전</span></button>
      <button class="btn-check" id="btnChk" ${checkDisabled} onclick="cardCheck()">${checkLabel}</button>
      <button class="btn-nav" ${isLast?'disabled':''} onclick="cardNav(1)"><span>건너뛰기</span> →</button>
    </div>
  `;

  if(!chkd){
    document.querySelectorAll('label.cc').forEach(lbl=>{
      lbl.addEventListener('click',()=>{
        const ci = Number(lbl.getAttribute('data-ci'));
        cans[cidx] = ci;
        document.querySelectorAll('label.cc').forEach(l=>l.classList.remove('cc-selected'));
        lbl.classList.add('cc-selected');
        const btn = document.getElementById('btnChk');
        if(btn) btn.disabled = false;
        updateSeg();
      });
    });
  }
}

function cardCheck(){
  if(cchk[cidx]){
    if(cidx < QD.length-1){ cidx++; renderCard(); }
    else { cdone = true; renderScore(); }
    return;
  }
  if(cans[cidx] === null) return;
  cchk[cidx] = true;
  updateSeg();
  renderCard();
}

function cardNav(d){
  cidx = Math.max(0, Math.min(QD.length-1, cidx+d));
  renderCard();
}

function renderScore(){
  const total   = QD.length;
  const correct = cans.filter((a,i)=>a===QD[i].ans).length;
  const wrong   = total - correct;
  const score   = Math.round((correct/total)*100);
  const msg     = score===100?'완벽해요! 🎉':score>=80?'잘했어요! 👏':score>=60?'조금 더 노력해요 💪':'다시 한 번 도전해요 📖';

  document.querySelectorAll('.seg').forEach((s,i)=>{
    s.className = 'seg';
    s.classList.add(cans[i]===QD[i].ans ? 's-correct' : 's-wrong');
  });
  document.getElementById('ctbCur').textContent = total;

  document.getElementById('mainCard').innerHTML = `
    <div class="score-card">
      <div style="font-size:12.5px;font-weight:700;color:var(--muted)">02강 · 청소년의 발달</div>
      <div class="sc-big">${score}점</div>
      <div class="sc-sub">${msg}</div>
      <div class="sc-grid">
        <div class="sc-item good"><div class="v">${correct}</div><div class="l">정답</div></div>
        <div class="sc-item bad"><div class="v">${wrong}</div><div class="l">오답</div></div>
        <div class="sc-item"><div class="v">${total}</div><div class="l">전체</div></div>
      </div>
      <div class="sc-actions">
        <button class="btn-check" style="max-width:none;padding:12px 22px" onclick="cardRestart()">🔄 다시 풀기</button>
        <button class="btn-nav" onclick="cardReview()">틀린 문제 복습</button>
      </div>
    </div>
  `;
}

function cardRestart(){
  cdone = false; cidx = 0;
  cans  = new Array(QD.length).fill(null);
  cchk  = new Array(QD.length).fill(false);
  updateSeg();
  renderCard();
}

function cardReview(){
  const first = QD.findIndex((_,i)=>cans[i]!==QD[i].ans);
  if(first===-1){ alert('모두 정답입니다! 🎉'); return; }
  cdone = false; cidx = first;
  renderCard();
}

/* ══════════════════════════
   LIST MODE
══════════════════════════ */
let lGraded = false;
document.getElementById('lTotalCount').textContent = QD.length;

function buildList(){
  const form = document.getElementById('listForm');
  form.innerHTML = '';
  QD.forEach((item,idx)=>{
    const wrap = document.createElement('div');
    wrap.className = 'lq'; wrap.id = `lq-${idx}`;
    const top = document.createElement('div'); top.className = 'lq-top';
    const no  = document.createElement('div'); no.className  = 'lq-no'; no.textContent = item.no;
    const p   = document.createElement('p');   p.className   = 'lq-text'; p.textContent = item.q;
    top.appendChild(no); top.appendChild(p); wrap.appendChild(top);
    const chs = document.createElement('div'); chs.className = 'lchoices';
    item.ch.forEach((c,ci)=>{
      const lbl = document.createElement('label'); lbl.className='lchoice';
      lbl.setAttribute('data-qi',idx); lbl.setAttribute('data-ci',ci);
      const inp = document.createElement('input');
      inp.type='radio'; inp.name=`lq_${idx}`; inp.value=ci;
      const sp = document.createElement('div'); sp.className='lc-text';
      sp.textContent=`${C[ci]} ${c}`;
      lbl.appendChild(inp); lbl.appendChild(sp); chs.appendChild(lbl);
    });
    wrap.appendChild(chs);
    const rev = document.createElement('div'); rev.className='linline-review'; rev.id=`lr-${idx}`;
    wrap.appendChild(rev); form.appendChild(wrap);
  });
}

function getLAns(){
  return QD.map((_,i)=>{
    const c = document.querySelector(`input[name="lq_${i}"]:checked`);
    return c ? Number(c.value) : null;
  });
}

document.getElementById('lBtnGrade').onclick = ()=>{
  const ua = getLAns();
  const fi = ua.findIndex(v=>v===null);
  if(fi!==-1){
    alert('모든 문항을 풀어 주세요!');
    document.getElementById(`lq-${fi}`).scrollIntoView({behavior:'smooth',block:'center'});
    return;
  }
  const ok = ua.filter((a,i)=>a===QD[i].ans).length;
  lGraded = true;
  const box = document.getElementById('lResultBox');
  box.style.display = 'block';
  document.getElementById('lResultTitle').textContent = `점수: ${Math.round(ok/QD.length*100)}점`;
  document.getElementById('lResultMeta').textContent  = `정답 ${ok}/${QD.length}`;
  document.getElementById('lBtnShowAns').style.display = 'inline-block';
  box.scrollIntoView({behavior:'smooth',block:'start'});
};

document.getElementById('lBtnShowAns').onclick = ()=>{
  if(!lGraded) return;
  const ua = getLAns();
  document.querySelectorAll('label.lchoice').forEach(l=>l.classList.remove('lhl-correct','lhl-wrong'));
  QD.forEach((item,qi)=>{
    const cl = document.querySelector(`label.lchoice[data-qi="${qi}"][data-ci="${item.ans}"]`);
    if(cl) cl.classList.add('lhl-correct');
    if(ua[qi] !== item.ans){
      const wl = document.querySelector(`label.lchoice[data-qi="${qi}"][data-ci="${ua[qi]}"]`);
      if(wl) wl.classList.add('lhl-wrong');
    }
    const rev = document.getElementById(`lr-${qi}`);
    const ok  = ua[qi]===item.ans;
    rev.innerHTML = `
      <div class="lrow">
        <div style="font-weight:900">해설</div>
        <span class="lbadge ${ok?'good':'bad'}">${ok?'정답':'오답'}</span>
      </div>
      <div class="lexp">${esc(item.exp)}</div>`;
    rev.style.display = 'block';
  });
};

function listReset(){
  document.querySelectorAll('input[type=radio]').forEach(r=>r.checked=false);
  document.querySelectorAll('label.lchoice').forEach(l=>l.classList.remove('lhl-correct','lhl-wrong'));
  document.querySelectorAll('.linline-review').forEach(r=>{r.style.display='none';r.innerHTML='';});
  lGraded = false;
  document.getElementById('lResultBox').style.display  = 'none';
  document.getElementById('lBtnShowAns').style.display = 'none';
  window.scrollTo({top:0,behavior:'smooth'});
}

/* ══════════════════════════
   INIT  (card mode default)
══════════════════════════ */
buildSegBar();
buildList();
setMode('card');
renderCard();
</script>
