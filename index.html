<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>02강 | 청소년의 발달 - 문제 풀이</title>
  <link href="https://fonts.googleapis.com/css2?family=Gmarket+Sans:wght@300;500;700&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#F6F8FA;
      --card:#FFFFFF;
      --mint:#47BFAE;
      --mint-2:#59C7B7;
      --sky:#63B6FF;
      --sky-2:#8CCBFF;
      --band:#DFF3F0;
      --text:#2F3A40;
      --muted:#7A8A93;
      --line:#E6ECEF;
      --orange:#FF7A3D;
      --radius-lg:20px;
      --radius-md:16px;
      --shadow: 0 10px 28px rgba(24,39,75,.10);
      --shadow-sm: 0 6px 18px rgba(24,39,75,.08);
    }
    *{ box-sizing:border-box; }
    html,body{ height:100%; }
    body{
      margin:0;
      font-family: "Noto Sans KR",system-ui,sans-serif;
      color:var(--text);
      background: var(--bg);
      line-height:1.6;
      overflow-x:hidden;
    }

    /* ========== MODE TOGGLE ========== */
    .mode-bar{
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(246,248,250,.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--line);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .mode-toggle{
      display: flex;
      background: #E6ECEF;
      border-radius: 999px;
      padding: 4px;
      gap: 4px;
    }
    .mode-btn{
      border: none;
      border-radius: 999px;
      padding: 8px 18px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: all .2s;
      background: transparent;
      color: var(--muted);
      font-family: "Noto Sans KR",sans-serif;
    }
    .mode-btn.active{
      background: #fff;
      color: var(--text);
      box-shadow: 0 2px 8px rgba(0,0,0,.10);
    }

    /* ========== LIST MODE (original) ========== */
    #listMode{ display:block; }
    #cardMode{ display:none; }

    .bg-deco::before,
    .bg-deco::after{
      content:"";
      position:fixed;
      z-index:-1;
      width:520px;
      height:520px;
      border-radius:999px;
      opacity:.45;
    }
    .bg-deco::before{
      left:-220px;top:120px;
      background: radial-gradient(circle at 30% 30%, rgba(99,182,255,.35), rgba(99,182,255,.10) 60%, transparent 70%);
    }
    .bg-deco::after{
      right:-260px;top:-140px;
      background: radial-gradient(circle at 40% 40%, rgba(71,191,174,.35), rgba(71,191,174,.10) 60%, transparent 72%);
    }
    .wrap{
      max-width: 1020px;
      margin: 0 auto;
      padding: 20px 16px 88px;
    }
    .hero{
      position:relative;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
      padding: 26px 20px 18px;
      text-align:center;
    }
    .unit-pill{
      display:inline-flex;align-items:center;justify-content:center;gap:8px;
      padding: 8px 14px;border-radius: 999px;
      background: linear-gradient(180deg, rgba(255,255,255,.65), rgba(255,255,255,0)),
                  linear-gradient(90deg, var(--mint), var(--mint-2));
      color:#fff;font-weight:700;font-size: 13px;letter-spacing:-.2px;
      box-shadow: 0 6px 16px rgba(71,191,174,.22);
    }
    .hero h1{
      margin: 14px 0 6px;font-size: 28px;letter-spacing:-.6px;font-weight: 800;
    }
    .underline{
      width: 40px;height: 4px;border-radius: 999px;
      background: var(--orange);margin: 10px auto 0;
    }
    .total-pill{
      position:absolute;top: 16px;right: 16px;
      padding: 8px 12px;border-radius: 999px;
      background: #EEF2F4;border: 1px solid var(--line);
      color: var(--muted);font-weight: 700;font-size: 13px;white-space:nowrap;
    }
    .section{
      margin-top: 18px;background: var(--card);
      border: 1px solid var(--line);border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);overflow:hidden;
    }
    .section-head{
      background: var(--band);padding: 14px 18px;
      font-weight: 800;font-size: 18px;letter-spacing:-.2px;
      display:flex;align-items:center;justify-content:space-between;gap:10px;
    }
    .section-body{ padding: 18px; }
    .q{
      background:#fff;border:1px solid var(--line);
      border-radius: var(--radius-md);padding: 14px 14px;margin-bottom: 12px;
    }
    .q-top{display:flex;align-items:flex-start;gap:10px;}
    .q-no{
      width: 46px;height: 30px;border-radius: 999px;
      background: rgba(99,182,255,.14);border: 1px solid rgba(99,182,255,.22);
      color: #2C6DD2;display:flex;align-items:center;justify-content:center;
      font-weight: 900;font-size: 13px;flex: 0 0 auto;
    }
    .q-text{margin:0;font-weight: 800;white-space:pre-wrap;letter-spacing:-.2px;}
    .choices{margin-top: 10px;display:grid;gap: 8px;}
    label.choice{
      display:flex;gap:10px;align-items:flex-start;
      padding: 10px 12px;border-radius: 14px;
      border:1px solid var(--line);background: #F9FBFC;
      cursor:pointer;transition: background .15s ease, border-color .15s ease;user-select:none;
    }
    label.choice:hover{ background: rgba(71,191,174,.08);border-color: rgba(71,191,174,.22); }
    input[type="radio"]{ margin-top: 2px;accent-color: var(--mint);transform: scale(1.05); }
    .c-text{ color: var(--text);font-weight: 400; }
    .actions{
      display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top: 14px;
    }
    button{
      border:0;border-radius: 14px;padding: 12px 14px;
      font-weight: 900;cursor:pointer;
      transition: transform .05s ease, filter .15s ease, opacity .2s ease;
      letter-spacing:-.1px;font-family:"Noto Sans KR",sans-serif;
    }
    button:active{ transform: translateY(1px); }
    .btn-primary{
      background: linear-gradient(180deg, rgba(255,255,255,.55), rgba(255,255,255,0)),
                  linear-gradient(90deg, var(--mint), var(--mint-2));
      color:#fff;box-shadow: 0 10px 18px rgba(71,191,174,.20);
    }
    .btn-blue{
      background: linear-gradient(180deg, rgba(255,255,255,.30), rgba(255,255,255,0)),
                  linear-gradient(90deg, #3A8FE8, var(--sky));
      color:#fff;box-shadow: 0 8px 18px rgba(44,109,210,.22);
    }
    .btn-ghost{
      background:#EEF2F4;border:1px solid var(--line);color: var(--muted);font-weight: 900;
    }
    .result{
      margin-top: 14px;padding: 14px;border-radius: var(--radius-md);
      border: 1px solid var(--line);background: rgba(71,191,174,.08);display:none;
    }
    .result h3{margin:0 0 6px;font-size: 16px;}
    .result .meta{color: var(--muted);font-size: 13px;font-weight: 700;}
    .badge{
      display:inline-flex;align-items:center;gap:8px;padding: 6px 10px;
      border-radius: 999px;font-size: 12px;border: 1px solid var(--line);
      background: #F6F8FA;color: var(--muted);font-weight: 900;white-space:nowrap;
    }
    .badge.good{ color: #158A67;border-color: rgba(21,138,103,.20);background: rgba(71,191,174,.10); }
    .badge.bad{ color: #C83A52;border-color: rgba(200,58,82,.18);background: rgba(255,122,61,.10); }
    .hl-correct{
      outline: 2px solid rgba(71,191,174,.55);
      border-color: rgba(71,191,174,.35) !important;
      background: rgba(71,191,174,.10) !important;
    }
    .hl-wrong{
      outline: 2px solid rgba(200,58,82,.55);
      border-color: rgba(200,58,82,.25) !important;
      background: rgba(255,122,61,.10) !important;
    }
    .inline-review{
      margin-top: 12px;padding: 12px;border-radius: 14px;
      border: 1px solid var(--line);background: rgba(99,182,255,.08);display:none;
    }
    .inline-review .row{
      display:flex;align-items:flex-start;justify-content:space-between;gap:10px;flex-wrap:wrap;
    }
    .inline-review .explain{
      margin-top: 8px;white-space:pre-wrap;color: var(--text);font-weight: 400;
    }
    .fab{
      position: fixed;right: 16px;bottom: 16px;
      display:flex;flex-direction:column;gap:10px;z-index: 50;
    }
    .fab button{padding: 12px 14px;border-radius: 999px;box-shadow: var(--shadow-sm);}

    /* ========== CARD / PAD MODE ========== */
    #cardMode{
      min-height: 100vh;
      background: linear-gradient(135deg, #E8F4F1 0%, #EEF5FF 50%, #F3EFF8 100%);
      display: flex;
      flex-direction: column;
    }

    .card-header{
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .card-pill{
      display:inline-flex;align-items:center;gap:6px;
      padding: 6px 14px;border-radius: 999px;
      background: linear-gradient(90deg, var(--mint), var(--mint-2));
      color:#fff;font-weight:700;font-size: 12px;
      box-shadow: 0 4px 12px rgba(71,191,174,.22);
    }
    .progress-wrap{
      flex: 1;
      max-width: 320px;
    }
    .progress-text{
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      margin-bottom: 4px;
    }
    .progress-bar{
      height: 6px;
      background: rgba(0,0,0,.08);
      border-radius: 999px;
      overflow: hidden;
    }
    .progress-fill{
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--mint), var(--sky));
      transition: width .4s cubic-bezier(.4,0,.2,1);
    }

    .card-stage{
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px 20px 24px;
    }

    .card-frame{
      width: 100%;
      max-width: 680px;
      position: relative;
    }

    /* Stack illusion */
    .card-frame::before,
    .card-frame::after{
      content:"";
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      border-radius: 24px;
      background: #fff;
      border: 1px solid rgba(0,0,0,.06);
    }
    .card-frame::after{
      width: calc(100% - 24px);
      height: 100%;
      bottom: -10px;
      z-index: 0;
      opacity: .5;
      box-shadow: 0 4px 16px rgba(0,0,0,.06);
    }
    .card-frame::before{
      width: calc(100% - 44px);
      height: 100%;
      bottom: -18px;
      z-index: -1;
      opacity: .3;
    }

    .card{
      position: relative;
      z-index: 1;
      background: #fff;
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(24,39,75,.12), 0 4px 16px rgba(24,39,75,.06);
      padding: 32px 28px 24px;
      transition: transform .15s ease, box-shadow .15s ease;
      border: 1px solid rgba(255,255,255,.9);
      overflow: hidden;
    }
    .card::before{
      content:"";
      position:absolute;
      top:0;left:0;right:0;
      height:4px;
      background: linear-gradient(90deg, var(--mint), var(--sky));
      border-radius: 24px 24px 0 0;
    }

    .card-q-no{
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 999px;
      background: linear-gradient(135deg, rgba(99,182,255,.15), rgba(71,191,174,.12));
      border: 1px solid rgba(99,182,255,.25);
      color: #2C6DD2;
      font-weight: 900;
      font-size: 13px;
      margin-bottom: 18px;
    }
    .card-q-text{
      font-size: 17px;
      font-weight: 800;
      letter-spacing: -.3px;
      white-space: pre-wrap;
      line-height: 1.65;
      margin-bottom: 22px;
    }

    .card-choices{
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    label.card-choice{
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 13px 16px;
      border-radius: 16px;
      border: 2px solid var(--line);
      background: #FAFBFC;
      cursor: pointer;
      transition: all .18s ease;
      user-select: none;
      position: relative;
      overflow: hidden;
    }
    label.card-choice::before{
      content:"";
      position:absolute;
      inset:0;
      background: linear-gradient(90deg, rgba(71,191,174,.0), rgba(71,191,174,.0));
      transition: background .2s;
    }
    label.card-choice:hover{
      border-color: var(--mint);
      background: rgba(71,191,174,.06);
      transform: translateY(-1px);
      box-shadow: 0 4px 14px rgba(71,191,174,.15);
    }
    label.card-choice.selected{
      border-color: var(--sky);
      background: linear-gradient(135deg, rgba(99,182,255,.08), rgba(71,191,174,.06));
      box-shadow: 0 4px 14px rgba(99,182,255,.18);
    }
    label.card-choice input[type="radio"]{
      margin-top: 2px;
      accent-color: var(--mint);
      transform: scale(1.15);
      flex-shrink: 0;
    }
    .card-c-num{
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: rgba(99,182,255,.12);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 900;
      color: #2C6DD2;
      flex-shrink: 0;
    }
    .card-c-text{
      font-size: 14.5px;
      color: var(--text);
      line-height: 1.55;
    }

    /* Result overlay inside card */
    .card-result{
      margin-top: 18px;
      padding: 16px;
      border-radius: 16px;
      display: none;
      animation: fadeSlideUp .3s ease forwards;
    }
    .card-result.correct{
      background: linear-gradient(135deg, rgba(71,191,174,.12), rgba(71,191,174,.06));
      border: 1.5px solid rgba(71,191,174,.35);
    }
    .card-result.wrong{
      background: linear-gradient(135deg, rgba(255,122,61,.10), rgba(255,122,61,.04));
      border: 1.5px solid rgba(200,58,82,.25);
    }
    .card-result-badge{
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      font-weight: 900;
      margin-bottom: 8px;
    }
    .card-result-badge.correct{ color: #158A67; }
    .card-result-badge.wrong{ color: #C83A52; }
    .card-result-explain{
      font-size: 13.5px;
      color: var(--text);
      line-height: 1.65;
    }
    .card-result-cor{
      margin-top: 8px;
      font-size: 13px;
      font-weight: 700;
      color: #158A67;
    }

    @keyframes fadeSlideUp{
      from{ opacity:0; transform:translateY(10px); }
      to{ opacity:1; transform:translateY(0); }
    }

    /* Card controls */
    .card-controls{
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 22px;
      gap: 10px;
      flex-wrap: wrap;
    }
    .btn-nav{
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 20px;
      border-radius: 14px;
      border: 2px solid var(--line);
      background: #fff;
      color: var(--text);
      font-weight: 900;
      font-size: 14px;
      cursor: pointer;
      transition: all .15s;
    }
    .btn-nav:hover{ border-color: var(--mint); background: rgba(71,191,174,.06); }
    .btn-nav:disabled{ opacity:.35; cursor:not-allowed; }
    .btn-nav:disabled:hover{ border-color: var(--line); background:#fff; }
    .btn-check{
      flex: 1;
      max-width: 180px;
      padding: 13px 20px;
      border-radius: 14px;
      border: none;
      background: linear-gradient(180deg, rgba(255,255,255,.4), rgba(255,255,255,0)),
                  linear-gradient(90deg, var(--mint), var(--mint-2));
      color: #fff;
      font-weight: 900;
      font-size: 14px;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(71,191,174,.25);
      transition: all .15s;
    }
    .btn-check:hover{ filter: brightness(1.05); transform: translateY(-1px); }
    .btn-check:disabled{ opacity:.45; cursor:not-allowed; transform:none; }

    /* Final score card */
    .score-card{
      text-align: center;
      padding: 20px 10px;
    }
    .score-big{
      font-size: 72px;
      font-weight: 900;
      line-height: 1;
      background: linear-gradient(135deg, var(--mint), var(--sky));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin: 16px 0 8px;
    }
    .score-sub{
      font-size: 16px;
      color: var(--muted);
      font-weight: 700;
      margin-bottom: 24px;
    }
    .score-detail-grid{
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 24px;
    }
    .score-detail-item{
      padding: 14px 10px;
      border-radius: 16px;
      border: 1px solid var(--line);
      background: #FAFBFC;
    }
    .score-detail-item .val{
      font-size: 24px;
      font-weight: 900;
      color: var(--text);
    }
    .score-detail-item .lbl{
      font-size: 11px;
      color: var(--muted);
      font-weight: 700;
      margin-top: 2px;
    }
    .score-detail-item.good .val{ color: #158A67; }
    .score-detail-item.bad .val{ color: #C83A52; }
    .score-actions{
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }

    /* Highlights in card mode */
    label.card-choice.hl-correct{
      border-color: rgba(71,191,174,.8) !important;
      background: rgba(71,191,174,.12) !important;
      box-shadow: 0 0 0 1px rgba(71,191,174,.3);
    }
    label.card-choice.hl-wrong{
      border-color: rgba(200,58,82,.7) !important;
      background: rgba(255,122,61,.10) !important;
      box-shadow: 0 0 0 1px rgba(200,58,82,.2);
    }

    /* Counter dots */
    .dot-row{
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      justify-content: center;
      padding: 0 20px 16px;
    }
    .dot{
      width: 10px;height: 10px;
      border-radius: 50%;
      background: #D8E0E5;
      transition: background .3s;
      cursor: pointer;
    }
    .dot.answered{ background: var(--sky); }
    .dot.current{ background: var(--mint); box-shadow: 0 0 0 2px rgba(71,191,174,.3); }
    .dot.correct-dot{ background: #47BFA0; }
    .dot.wrong-dot{ background: #E06070; }

    @media (max-width: 520px){
      .hero h1{ font-size: 22px; }
      .card{ padding: 24px 18px 20px; }
      .card-q-text{ font-size: 15px; }
      .card-c-text{ font-size: 13.5px; }
      .score-big{ font-size: 56px; }
    }
    @media (max-width: 380px){
      .card-controls{ justify-content:center; }
      .btn-nav span{ display:none; }
    }
  </style>
</head>
<body class="bg-deco">

  <!-- MODE BAR -->
  <div class="mode-bar">
    <div class="mode-toggle">
      <button class="mode-btn active" id="modeBtnList" onclick="setMode('list')">📋 전체 목록형</button>
      <button class="mode-btn" id="modeBtnCard" onclick="setMode('card')">🃏 한 문제씩 풀기</button>
    </div>
  </div>

  <!-- ========== LIST MODE ========== -->
  <div id="listMode">
    <div class="wrap">
      <header class="hero" aria-label="헤더">
        <div class="unit-pill">[내신만점] 가정 ① (2025)</div>
        <div class="total-pill">총 <b id="totalCount">0</b>문항</div>
        <h1>02강. 청소년의 발달 - 학교 시험 정복 문제</h1>
        <div class="underline" aria-hidden="true"></div>
      </header>
      <section class="section" aria-label="문제 영역">
        <div class="section-head"><div>문제 풀이</div></div>
        <div class="section-body">
          <form id="quizForm"></form>
          <div class="actions">
            <button class="btn-primary" id="btnGrade" type="button">결과 확인하기</button>
            <button class="btn-blue" id="btnShowAnswers" type="button" style="display:none;">정답 확인하기</button>
          </div>
          <div class="result" id="resultBox" role="status" aria-live="polite">
            <h3 id="resultTitle">점수</h3>
            <div class="meta" id="resultMeta"></div>
          </div>
        </div>
      </section>
    </div>
    <div class="fab" aria-label="빠른 버튼">
      <button class="btn-blue" id="btnScrollTop" type="button">맨 위로</button>
      <button class="btn-blue" id="btnReset" type="button">다시 풀기</button>
    </div>
  </div>

  <!-- ========== CARD MODE ========== -->
  <div id="cardMode">
    <div class="card-header">
      <div class="card-pill">02강 · 청소년의 발달</div>
      <div class="progress-wrap">
        <div class="progress-text">
          <span id="cardProgressText">1 / 15</span>
          <span id="cardProgressPct">0%</span>
        </div>
        <div class="progress-bar">
          <div class="progress-fill" id="cardProgressFill" style="width:0%"></div>
        </div>
      </div>
    </div>

    <div class="dot-row" id="dotRow"></div>

    <div class="card-stage">
      <div class="card-frame">
        <div class="card" id="mainCard">
          <!-- Filled by JS -->
        </div>
      </div>
    </div>
  </div>

<script>
  const circled = ["①","②","③","④","⑤"];
  const quizData = [

  // ===== MODE SWITCH =====
  let currentMode = 'list';
  function setMode(mode){
    currentMode = mode;
    document.getElementById('listMode').style.display = mode==='list' ? 'block' : 'none';
    document.getElementById('cardMode').style.display = mode==='card' ? 'flex' : 'none';
    document.getElementById('modeBtnList').classList.toggle('active', mode==='list');
    document.getElementById('modeBtnCard').classList.toggle('active', mode==='card');
    if(mode==='card') renderCardMode();
  }

  // ===== LIST MODE =====
  const quizForm = document.getElementById("quizForm");
  const totalCount = document.getElementById("totalCount");
  const btnGrade = document.getElementById("btnGrade");
  const btnShowAnswers = document.getElementById("btnShowAnswers");
  const btnReset = document.getElementById("btnReset");
  const btnScrollTop = document.getElementById("btnScrollTop");
  const resultBox = document.getElementById("resultBox");
  const resultTitle = document.getElementById("resultTitle");
  const resultMeta = document.getElementById("resultMeta");
  let graded = false;
  totalCount.textContent = quizData.length;

  function escapeHtml(str){
    return String(str).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#39;");
  }

  function renderQuiz(){
    quizForm.innerHTML = "";
    quizData.forEach((item, idx) => {
      const wrap = document.createElement("div");
      wrap.className = "q"; wrap.id = `q-${idx}`;
      const top = document.createElement("div"); top.className = "q-top";
      const no = document.createElement("div"); no.className = "q-no"; no.textContent = item.no;
      const p = document.createElement("p"); p.className = "q-text"; p.textContent = item.q;
      top.appendChild(no); top.appendChild(p); wrap.appendChild(top);
      const choices = document.createElement("div"); choices.className = "choices";
      item.choices.forEach((c, cIdx) => {
        const label = document.createElement("label");
        label.className = "choice";
        label.setAttribute("data-qidx", idx);
        label.setAttribute("data-cidx", cIdx);
        const input = document.createElement("input");
        input.type = "radio"; input.name = `q_${idx}`; input.value = cIdx;
        const span = document.createElement("div"); span.className = "c-text";
        span.textContent = `${circled[cIdx]} ${c}`;
        label.appendChild(input); label.appendChild(span);
        choices.appendChild(label);
      });
      wrap.appendChild(choices);
      const inline = document.createElement("div");
      inline.className = "inline-review"; inline.id = `inline-${idx}`;
      wrap.appendChild(inline);
      quizForm.appendChild(wrap);
    });
  }

  function getUserAnswers(){
    return quizData.map((_, idx) => {
      const checked = document.querySelector(`input[name="q_${idx}"]:checked`);
      return checked ? Number(checked.value) : null;
    });
  }

  function clearHighlights(){
    document.querySelectorAll("label.choice").forEach(l => l.classList.remove("hl-correct","hl-wrong"));
  }
  function hideAllInlineReviews(){
    document.querySelectorAll(".inline-review").forEach(box => { box.style.display="none"; box.innerHTML=""; });
  }
  function findFirstUnanswered(user){ return user.findIndex(v => v===null); }

  function grade(){
    const user = getUserAnswers();
    const firstUnanswered = findFirstUnanswered(user);
    if(firstUnanswered !== -1){
      alert("모든 문항을 풀어 주세요!\n미응답 문항이 있으면 채점이 진행되지 않습니다.");
      document.getElementById(`q-${firstUnanswered}`).scrollIntoView({behavior:"smooth",block:"center"});
      return;
    }
    let correct = 0;
    user.forEach((u, idx) => { if(u===quizData[idx].answer) correct++; });
    const total = quizData.length;
    const score100 = Math.round((correct/total)*100);
    graded = true;
    resultBox.style.display="block";
    resultTitle.textContent=`점수: ${score100}점`;
    resultMeta.textContent=`정답 ${correct}/${total}`;
    btnShowAnswers.style.display="inline-block";
    hideAllInlineReviews(); clearHighlights();
    resultBox.scrollIntoView({behavior:"smooth",block:"start"});
  }

  function showAnswers(){
    if(!graded){ alert("먼저 결과 확인하기로 채점해 주세요!"); return; }
    const user = getUserAnswers();
    clearHighlights();
    quizData.forEach((item, qIdx) => {
      const correctIdx = item.answer;
      const userIdx = user[qIdx];
      const correctLabel = document.querySelector(`label.choice[data-qidx="${qIdx}"][data-cidx="${correctIdx}"]`);
      if(correctLabel) correctLabel.classList.add("hl-correct");
      if(userIdx !== correctIdx){
        const wrongLabel = document.querySelector(`label.choice[data-qidx="${qIdx}"][data-cidx="${userIdx}"]`);
        if(wrongLabel) wrongLabel.classList.add("hl-wrong");
      }
      const inline = document.getElementById(`inline-${qIdx}`);
      const isCorrect = userIdx===correctIdx;
      inline.innerHTML = `
        <div class="row">
          <div style="font-weight:900;letter-spacing:-.2px;">해설</div>
          <span class="badge ${isCorrect?"good":"bad"}">${isCorrect?"정답":"오답"}</span>
        </div>
        <div class="explain" style="margin-top:8px;">${escapeHtml(item.explain)}</div>
      `;
      inline.style.display = "block";
    });
  }

  function resetAll(){
    document.querySelectorAll('input[type="radio"]').forEach(r => r.checked=false);
    clearHighlights(); hideAllInlineReviews();
    graded=false; resultBox.style.display="none"; btnShowAnswers.style.display="none";
    window.scrollTo({top:0,behavior:"smooth"});
  }

  btnGrade.addEventListener("click", grade);
  btnShowAnswers.addEventListener("click", showAnswers);
  btnReset.addEventListener("click", resetAll);
  btnScrollTop.addEventListener("click", () => window.scrollTo({top:0,behavior:"smooth"}));
  renderQuiz();

  // ===== CARD MODE =====
  let cardIdx = 0;
  let cardAnswers = new Array(quizData.length).fill(null);
  let cardChecked = new Array(quizData.length).fill(false);
  let cardDone = false;

  function renderCardMode(){
    cardIdx = 0;
    cardAnswers = new Array(quizData.length).fill(null);
    cardChecked = new Array(quizData.length).fill(false);
    cardDone = false;
    renderDots();
    renderCard();
  }

  function renderDots(){
    const row = document.getElementById('dotRow');
    row.innerHTML = '';
    quizData.forEach((_, i) => {
      const d = document.createElement('div');
      d.className = 'dot';
      d.title = `${i+1}번 문제`;
      d.onclick = () => { cardIdx = i; renderCard(); };
      row.appendChild(d);
    });
    updateDots();
  }

  function updateDots(){
    const dots = document.querySelectorAll('.dot');
    dots.forEach((d, i) => {
      d.className = 'dot';
      if(cardChecked[i]){
        d.classList.add(cardAnswers[i]===quizData[i].answer ? 'correct-dot' : 'wrong-dot');
      } else if(cardAnswers[i] !== null){
        d.classList.add('answered');
      }
      if(i === cardIdx) d.classList.add('current');
    });
  }

  function updateProgress(){
    const total = quizData.length;
    const answered = cardAnswers.filter(v=>v!==null).length;
    const pct = Math.round((answered/total)*100);
    document.getElementById('cardProgressText').textContent = `${cardIdx+1} / ${total}`;
    document.getElementById('cardProgressPct').textContent = `${pct}%`;
    document.getElementById('cardProgressFill').style.width = pct+'%';
  }

  function renderCard(){
    if(cardDone){ renderScoreCard(); return; }
    updateProgress();
    updateDots();
    const item = quizData[cardIdx];
    const card = document.getElementById('mainCard');
    const userAns = cardAnswers[cardIdx];
    const checked = cardChecked[cardIdx];

    let choicesHTML = item.choices.map((c, cIdx) => {
      let cls = 'card-choice';
      if(userAns===cIdx) cls+=' selected';
      if(checked){
        if(cIdx===item.answer) cls+=' hl-correct';
        else if(cIdx===userAns) cls+=' hl-wrong';
      }
      return `<label class="${cls}" data-cidx="${cIdx}">
        <input type="radio" name="card_q" value="${cIdx}" ${userAns===cIdx?'checked':''} ${checked?'disabled':''}>
        <div class="card-c-num">${circled[cIdx]}</div>
        <div class="card-c-text">${escapeHtml(c)}</div>
      </label>`;
    }).join('');

    let resultHTML = '';
    if(checked){
      const isCorrect = userAns===item.answer;
      const corTxt = `${circled[item.answer]} ${item.choices[item.answer]}`;
      resultHTML = `<div class="card-result ${isCorrect?'correct':'wrong'}" style="display:block;">
        <div class="card-result-badge ${isCorrect?'correct':'wrong'}">${isCorrect?'✅ 정답입니다!':'❌ 오답입니다'}</div>
        <div class="card-result-explain">${escapeHtml(item.explain)}</div>
        ${!isCorrect?`<div class="card-result-cor">✔ 정답: ${escapeHtml(corTxt)}</div>`:''}
      </div>`;
    }

    const isLast = cardIdx === quizData.length-1;
    const btnCheckLabel = checked ? (isLast ? '결과 보기 →' : '다음 문제 →') : '정답 확인';

    card.innerHTML = `
      <div class="card-q-no">문제 ${item.no}</div>
      <div class="card-q-text">${escapeHtml(item.q)}</div>
      <div class="card-choices">${choicesHTML}</div>
      ${resultHTML}
      <div class="card-controls">
        <button class="btn-nav" id="cardBtnPrev" ${cardIdx===0?'disabled':''} onclick="cardNav(-1)">← <span>이전</span></button>
        <button class="btn-check" id="cardBtnCheck" ${userAns===null&&!checked?'disabled':''} onclick="cardCheck()">${btnCheckLabel}</button>
        <button class="btn-nav" id="cardBtnSkip" onclick="cardNav(1)" ${cardIdx===quizData.length-1?'disabled':''}>→ <span>건너뛰기</span></button>
      </div>
    `;

    // bind choice click
    card.querySelectorAll('label.card-choice').forEach(lbl => {
      if(checked) return;
      lbl.addEventListener('click', () => {
        const cidx = Number(lbl.getAttribute('data-cidx'));
        cardAnswers[cardIdx] = cidx;
        card.querySelectorAll('label.card-choice').forEach(l=>l.classList.remove('selected'));
        lbl.classList.add('selected');
        document.getElementById('cardBtnCheck').disabled = false;
      });
    });
  }

  function cardCheck(){
    const item = quizData[cardIdx];
    const userAns = cardAnswers[cardIdx];
    if(cardChecked[cardIdx]){
      // already checked → go next or show score
      if(cardIdx < quizData.length-1){
        cardIdx++;
        renderCard();
      } else {
        cardDone = true;
        renderScoreCard();
      }
      return;
    }
    if(userAns===null) return;
    cardChecked[cardIdx] = true;
    updateDots();
    renderCard();
  }

  function cardNav(dir){
    cardIdx = Math.max(0, Math.min(quizData.length-1, cardIdx+dir));
    renderCard();
  }

  function renderScoreCard(){
    const total = quizData.length;
    const correct = cardAnswers.filter((a,i)=>a===quizData[i].answer).length;
    const wrong = total - correct;
    const score = Math.round((correct/total)*100);
    const msg = score===100?'완벽해요! 🎉':score>=80?'잘했어요! 👏':score>=60?'조금 더 노력해요 💪':'다시 한 번 도전해봐요 📖';

    document.getElementById('mainCard').innerHTML = `
      <div class="score-card">
        <div style="font-size:13px;font-weight:700;color:var(--muted);">[02강] 청소년의 발달</div>
        <div class="score-big">${score}점</div>
        <div class="score-sub">${msg}</div>
        <div class="score-detail-grid">
          <div class="score-detail-item good">
            <div class="val">${correct}</div>
            <div class="lbl">정답</div>
          </div>
          <div class="score-detail-item bad">
            <div class="val">${wrong}</div>
            <div class="lbl">오답</div>
          </div>
          <div class="score-detail-item">
            <div class="val">${total}</div>
            <div class="lbl">전체</div>
          </div>
        </div>
        <div class="score-actions">
          <button class="btn-check" style="max-width:none;padding:13px 24px;" onclick="cardRestart()">다시 풀기 🔄</button>
          <button class="btn-nav" onclick="cardReview()">틀린 문제 복습</button>
        </div>
      </div>
    `;
    document.getElementById('cardProgressFill').style.width='100%';
    document.getElementById('cardProgressPct').textContent='100%';
  }

  function cardRestart(){
    cardDone = false;
    cardIdx = 0;
    cardAnswers = new Array(quizData.length).fill(null);
    cardChecked = new Array(quizData.length).fill(false);
    renderDots();
    renderCard();
  }

  function cardReview(){
    // jump to first wrong
    const firstWrong = quizData.findIndex((item, i)=>cardAnswers[i]!==item.answer);
    if(firstWrong===-1){ alert("모두 정답입니다! 🎉"); return; }
    cardDone = false;
    cardIdx = firstWrong;
    renderCard();
  }
</script>
</body>
</html>
