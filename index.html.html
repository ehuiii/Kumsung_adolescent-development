<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>02강 | 청소년의 발달 - 문제 풀이</title>
  <style>
    :root{
      --bg:#F6F8FA;
      --card:#FFFFFF;
      --mint:#47BFAE;
      --mint-2:#59C7B7;
      --sky:#63B6FF;
      --sky-2:#8CCBFF;
      --band:#DFF3F0;
      --text:#2F3A40;
      --muted:#7A8A93;
      --line:#E6ECEF;
      --orange:#FF7A3D;
      --radius-lg:20px;
      --radius-md:16px;
      --shadow: 0 10px 28px rgba(24,39,75,.10);
      --shadow-sm: 0 6px 18px rgba(24,39,75,.08);
    }
    *{ box-sizing:border-box; }
    html,body{ height:100%; }
    body{
      margin:0;
      font-family: "Pretendard","Noto Sans KR",system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      color:var(--text);
      background: var(--bg);
      line-height:1.6;
      overflow-x:hidden;
    }
    .bg-deco::before,
    .bg-deco::after{
      content:"";
      position:fixed;
      z-index:-1;
      width:520px;
      height:520px;
      border-radius:999px;
      opacity:.45;
    }
    .bg-deco::before{
      left:-220px;
      top:120px;
      background: radial-gradient(circle at 30% 30%, rgba(99,182,255,.35), rgba(99,182,255,.10) 60%, transparent 70%);
    }
    .bg-deco::after{
      right:-260px;
      top:-140px;
      background: radial-gradient(circle at 40% 40%, rgba(71,191,174,.35), rgba(71,191,174,.10) 60%, transparent 72%);
    }
    .wrap{
      max-width: 1020px;
      margin: 0 auto;
      padding: 26px 16px 88px;
    }
    .hero{
      position:relative;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
      padding: 26px 20px 18px;
      text-align:center;
    }
    .unit-pill{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      padding: 8px 14px;
      border-radius: 999px;
      background: linear-gradient(180deg, rgba(255,255,255,.65), rgba(255,255,255,.0)),
                  linear-gradient(90deg, var(--mint), var(--mint-2));
      color:#fff;
      font-weight:700;
      font-size: 13px;
      letter-spacing:-.2px;
      box-shadow: 0 6px 16px rgba(71,191,174,.22);
    }
    .hero h1{
      margin: 14px 0 6px;
      font-size: 34px;
      letter-spacing:-.6px;
      font-weight: 800;
    }
    .underline{
      width: 40px;
      height: 4px;
      border-radius: 999px;
      background: var(--orange);
      margin: 10px auto 0;
    }
    .total-pill{
      position:absolute;
      top: 16px;
      right: 16px;
      padding: 8px 12px;
      border-radius: 999px;
      background: #EEF2F4;
      border: 1px solid var(--line);
      color: var(--muted);
      font-weight: 700;
      font-size: 13px;
      white-space:nowrap;
    }
    .section{
      margin-top: 18px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
      overflow:hidden;
    }
    .section-head{
      background: var(--band);
      padding: 14px 18px;
      font-weight: 800;
      font-size: 18px;
      letter-spacing:-.2px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
    }
    .section-body{
      padding: 18px;
    }
    .q{
      background:#fff;
      border:1px solid var(--line);
      border-radius: var(--radius-md);
      padding: 14px 14px;
      margin-bottom: 12px;
    }
    .q-top{
      display:flex;
      align-items:flex-start;
      gap:10px;
    }
    .q-no{
      width: 46px;
      height: 30px;
      border-radius: 999px;
      background: rgba(99,182,255,.14);
      border: 1px solid rgba(99,182,255,.22);
      color: #2C6DD2;
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight: 900;
      font-size: 13px;
      flex: 0 0 auto;
    }
    .q-text{
      margin:0;
      font-weight: 800;
      white-space:pre-wrap;
      letter-spacing:-.2px;
    }
    .choices{
      margin-top: 10px;
      display:grid;
      gap: 8px;
    }
    label.choice{
      display:flex;
      gap:10px;
      align-items:flex-start;
      padding: 10px 12px;
      border-radius: 14px;
      border:1px solid var(--line);
      background: #F9FBFC;
      cursor:pointer;
      transition: background .15s ease, border-color .15s ease, transform .05s ease;
      user-select:none;
    }
    label.choice:hover{
      background: rgba(71,191,174,.08);
      border-color: rgba(71,191,174,.22);
    }
    input[type="radio"]{
      margin-top: 2px;
      accent-color: var(--mint);
      transform: scale(1.05);
    }
    .c-text{
      color: var(--text);
      font-weight: 400;
    }
    .actions{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      align-items:center;
      margin-top: 14px;
    }
    button{
      border:0;
      border-radius: 14px;
      padding: 12px 14px;
      font-weight: 900;
      cursor:pointer;
      transition: transform .05s ease, filter .15s ease, opacity .2s ease;
      letter-spacing:-.1px;
    }
    button:active{ transform: translateY(1px); }
    .btn-primary{
      background: linear-gradient(180deg, rgba(255,255,255,.55), rgba(255,255,255,0)),
                  linear-gradient(90deg, var(--mint), var(--mint-2));
      color:#fff;
      box-shadow: 0 10px 18px rgba(71,191,174,.20);
    }
    /* 파란색 버튼 스타일 */
    .btn-blue{
      background: linear-gradient(180deg, rgba(255,255,255,.30), rgba(255,255,255,0)),
                  linear-gradient(90deg, #3A8FE8, var(--sky));
      color:#fff;
      box-shadow: 0 8px 18px rgba(44,109,210,.22);
    }
    .btn-ghost{
      background:#EEF2F4;
      border:1px solid var(--line);
      color: var(--muted);
      font-weight: 900;
    }
    .result{
      margin-top: 14px;
      padding: 14px;
      border-radius: var(--radius-md);
      border: 1px solid var(--line);
      background: rgba(71,191,174,.08);
      display:none;
    }
    .result h3{
      margin:0 0 6px;
      font-size: 16px;
    }
    .result .meta{
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }
    .badge{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 12px;
      border: 1px solid var(--line);
      background: #F6F8FA;
      color: var(--muted);
      font-weight: 900;
      white-space:nowrap;
    }
    .badge.good{ color: #158A67; border-color: rgba(21,138,103,.20); background: rgba(71,191,174,.10); }
    .badge.bad{ color: #C83A52; border-color: rgba(200,58,82,.18); background: rgba(255,122,61,.10); }
    .hl-correct{
      outline: 2px solid rgba(71,191,174,.55);
      border-color: rgba(71,191,174,.35) !important;
      background: rgba(71,191,174,.10) !important;
    }
    .hl-wrong{
      outline: 2px solid rgba(200,58,82,.55);
      border-color: rgba(200,58,82,.25) !important;
      background: rgba(255,122,61,.10) !important;
    }
    .inline-review{
      margin-top: 12px;
      padding: 12px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: rgba(99,182,255,.08);
      display:none;
    }
    .inline-review .row{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:10px;
      flex-wrap:wrap;
    }
    .inline-review .ans{
      margin-top: 8px;
      color: var(--muted);
      font-weight: 400;
    }
    .inline-review .ans b{
      font-weight: 700;
    }
    .inline-review .explain{
      margin-top: 8px;
      white-space:pre-wrap;
      color: var(--text);
      font-weight: 400;
    }
    .fab{
      position: fixed;
      right: 16px;
      bottom: 16px;
      display:flex;
      flex-direction:column;
      gap:10px;
      z-index: 50;
    }
    .fab button{
      padding: 12px 14px;
      border-radius: 999px;
      box-shadow: var(--shadow-sm);
    }
    @media (max-width: 520px){
      .hero h1{ font-size: 26px; }
      .total-pill{ top: 14px; right: 14px; }
    }
  </style>
</head>
<body class="bg-deco">
  <div class="wrap">
    <header class="hero" aria-label="헤더">
      <div class="unit-pill">[내신만점] 가정 ① (2025)</div>
      <div class="total-pill">총 <b id="totalCount">0</b>문항</div>
      <h1>02강. 청소년의 발달 - 학교 시험 정복 문제</h1>
      <div class="underline" aria-hidden="true"></div>
    </header>
    <section class="section" aria-label="문제 영역">
      <div class="section-head">
        <div>문제 풀이</div>
      </div>
      <div class="section-body">
        <form id="quizForm"></form>
        <div class="actions">
          <button class="btn-primary" id="btnGrade" type="button">결과 확인하기</button>
          <button class="btn-blue" id="btnShowAnswers" type="button" style="display:none;">정답 확인하기</button>
        </div>
        <div class="result" id="resultBox" role="status" aria-live="polite">
          <h3 id="resultTitle">점수</h3>
          <div class="meta" id="resultMeta"></div>
        </div>
      </div>
    </section>
  </div>
  <div class="fab" aria-label="빠른 버튼">
    <button class="btn-blue" id="btnScrollTop" type="button">맨 위로</button>
    <button class="btn-blue" id="btnReset" type="button">다시 풀기</button>
  </div>
<script>
  const circled = ["①","②","③","④","⑤"];
  const quizData = [
    { no:"01", q:"성장 급등의 특징에 대한 설명으로 옳지 않은 것은?",
      choices:["얼굴 길이가 짧아진다.","근육과 골격이 발달한다.","키와 몸무게가 급격히 증가한다.","머리가 차지하는 비율이 줄어든다.","손과 발, 팔다리, 몸통 순으로 발달한다."],
      answer:0, explain:"청소년은 성장 급등을 경험하며 몸에서 머리가 차지하는 비율이 줄어들고, 얼굴 모양이 길어진다."
    },
    { no:"02", q:"다음 설명에 해당하는 것은?\n청소년기에 성호르몬이 많이 분비되면서 남성과 여성의 신체적 특징이 뚜렷하게 구분되는 현상이다.",
      choices:["성장기","2차 성징","성장 급등","신체 발달","성장의 개인차"],
      answer:1, explain:"청소년기에는 성호르몬 분비에 따라 남성과 여성의 신체적 특징이 뚜렷하게 구분되는 2차 성징을 경험한다."
    },
    { no:"03", q:"성별과 2차 성징의 특징이 옳게 연결된 것은?",
      choices:["남성 - 유방이 커진다.","남성 - 골반이 넓어진다.","남성 - 겨드랑이에 털이 난다.","여성 - 고환과 음경이 커진다.","여성 - 어깨가 넓어지고 근육이 발달한다."],
      answer:2, explain:"겨드랑이 털이 나는 것은 청소년기 남녀 모두에게 나타나는 2차 성징의 특징이다."
    },
    { no:"04", q:"여성에게만 나타나는 2차 성징의 특징을 모두 고른 것은?\nㄱ. 고환 발달  ㄴ. 골반 발달\nㄷ. 몽정 경험  ㄹ. 어깨 발달\nㅁ. 유방 발달  ㅂ. 자궁 발달",
      choices:["ㄱ, ㄷ","ㄴ, ㄹ","ㅁ, ㅂ","ㄴ, ㅁ, ㅂ","ㄷ, ㄹ, ㅁ"],
      answer:3, explain:"청소년기 여성에게 나타나는 2차 성징의 특징에는 골반 발달, 유방 발달, 자궁 발달, 피하 지방 증가, 월경 시작 등이 있다."
    },
    { no:"05", q:"대화를 통해 알 수 있는 청소년기의 인지적 발달 특징으로 가장 적절한 것은?\nA: 세 가지 색을 섞어 검은색을 만들려면 어떻게 해야 할까요?\nB: 빨간색과 노란색을 섞으면 주황색이 되고 빨간색과 파란색을 섞으면 보라색이 되는 걸 보니 색은 더할수록 진해지는 것 같아요. 그렇다면….",
      choices:["가설적 사고","조합적 사고","추상적 사고","이상주의적 사고","자기중심적 사고"],
      answer:1, explain:"문제에 대한 여러 가능성을 찾고, 이를 조합하여 체계적으로 문제를 해결할 수 있는 사고 방법을 조합적 사고라 한다."
    },
    { no:"06", q:"다음 설명에 해당하는 청소년기 사고 유형은?\n우정은 눈에 보이지는 않지만 마음으로 알 수 있는 것이다. 우정이란 나보다 친구를 아끼고 위하는 것이다.",
      choices:["개인적 우화","사회성 발달","상상적 관중","추상적 사고","성장의 개인차"],
      answer:3, explain:"눈에 보이지 않는 사물이나 현상, 개념을 이해하는 사고 방법을 추상적 사고라 한다."
    },
    { no:"07", q:"청소년기 자기중심적 사고의 특징으로 옳은 것을 모두 고른 것은?\nㄱ. 무모한 행동을 자제한다.\nㄴ. 자신의 외모에 신경을 많이 쓴다.\nㄷ. 다른 사람도 자신에게 관심이 있다고 생각한다.\nㄹ. 자신에 대해 타인의 시선으로 객관적으로 생각한다.",
      choices:["ㄱ, ㄷ","ㄴ, ㄷ","ㄱ, ㄴ, ㄷ","ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],
      answer:1, explain:"청소년기에는 자신의 생각, 외모, 행동에 몰두하며 다른 사람의 관심이 자신에게만 집중되어 있다고 생각한다."
    },
    { no:"08", q:"청소년기의 인지적 발달 특징에 대한 설명으로 옳지 않은 것은?",
      choices:["문제 해결을 위해 가설을 세운다.","자신을 특별한 존재라고 생각한다.","사랑과 같은 추상적인 개념을 이해한다.","자신이 생각하는 이상적인 기준이 생긴다.","자신보다는 다른 사람의 관심사에 몰두한다."],
      answer:4, explain:"청소년기에는 자신과 다른 사람의 관심사를 구분하지 못하고 자기중심적으로 생각하는 경향이 있다."
    },
    { no:"09", q:"㉠과 ㉡에 들어갈 알맞은 말은?\n청소년기에는 급격한 신체 변화, 새로운 인간관계, 진로 고민으로 정서적으로 (㉠)해지기 쉽다. 이러한 특징 때문에 청소년기를 (㉡)라고도 한다.\n순서대로 ㉠ / ㉡을 고르시오.",
      choices:["안정 / 사춘기","안정 / 질풍노도의 시기","불안정 / 과도기","불안정 / 갱년기","불안정 / 질풍노도의 시기"],
      answer:4, explain:"청소년기에는 감정 변화가 심해지고 정서적으로 불안정해지기 쉽다. 이렇듯 심한 감정 기복을 강한 바람과 성난 파도에 빗대어 청소년기를 질풍노도의 시기라고도 한다."
    },
    { no:"10", q:"청소년기의 사회적 발달 특징에 대한 설명으로 옳지 않은 것은?",
      choices:["자기주장이 강해진다.","또래에게서 친밀감을 느낀다.","인간관계의 범위가 좁아진다.","친구와의 관계를 중요시한다.","부모의 간섭에서 벗어나고 싶어 한다."],
      answer:2, explain:"청소년기에는 생활 범위가 넓어짐에 따라 다양한 사람들과 관계를 맺는다."
    },
    { no:"11", q:"다음을 읽고 물음에 답하시오.\n자신을 소중히 여기고 긍정적으로 인식하는 것을 (㉠)(이)라고 한다.\n㉠에 들어갈 알맞은 말은?",
      choices:["자신감","자기만족","자기 효능감","자아 정체성","자아 존중감"],
      answer:4, explain:"자아 존중감은 자신을 소중히 여기고 긍정적으로 인식하는 것을 의미한다."
    },
    { no:"12", q:"㉠에 대한 설명으로 가장 적절한 것은?",
      choices:["완벽함을 추구한다.","자존심의 동의어이다.","자신을 있는 그대로 받아들인다.","높은 목표를 세우며 향상할 수 있다.","타인과 비교하며 자신에게 부족한 부분을 보완한다."],
      answer:2, explain:"자존감이라고도 하는 자아 존중감은 자신을 있는 그대로 받아들이고 긍정적으로 인식하는 것이다."
    },
    { no:"13", q:"다음 중 자아 정체성에 대해 가장 잘 설명한 사람은?",
      choices:["재민: 자신을 소중히 여기는 마음이야.","지은: 우리는 모두 같은 사람일 뿐이야.","지수: 타인이 생각하는 내 모습을 통해 알 수 있어.","세종: 긍정적인 자아 정체성을 형성하면 자아 존중감이 높아져.","현우: 자신의 상황에 맞춰 그때그때 다르게 받아들일 수 있어."],
      answer:3, explain:"자아 정체성은 자신을 일관성 있게 받아들이고 다른 사람과 다른 고유한 존재로 인식하는 것이다. 긍정적인 자아 정체성이 형성된 사람은 자아 존중감이 높다는 특징이 있다."
    },
    { no:"14", q:"긍정적인 자아 정체성이 형성된 사람의 특징으로 옳은 것을 모두 고른 것은?\nㄱ. 삶의 목표가 뚜렷하다.\nㄴ. 미래에 대한 자신감이 있다.\nㄷ. 자신의 삶을 흘러가는 대로 둔다.\nㄹ. 유혹에 쉽게 휩쓸리지만 변화에 잘 적응한다.",
      choices:["ㄱ","ㄱ, ㄴ","ㄴ, ㄹ","ㄱ, ㄴ, ㄹ","ㄴ, ㄷ, ㄹ"],
      answer:1, explain:"긍정적인 자아 정체성이 형성된 사람은 자아 존중감이 높고 삶의 목표가 뚜렷하며 미래에 대한 자신감이 있다. 또한 변화에 잘 적응하고 유혹에 쉽게 휩쓸리지 않는 등 자신의 삶을 스스로 조절할 수 있다."
    },
    { no:"15", q:"긍정적인 자아 정체성 형성을 돕기 위해 ㉠에 들어갈 말로 가장 적절한 것은?\nA: 이번 특별 활동 시간에 어디에 가입할 거야?\nB: 나는 아직 정하지 못했어.\nA: 너는 노래를 좋아하니까 합창부에 가입해 보면 어떨까?\nB: 내가 노래를 좋아한다고? 흠…. 난 내가 무엇을 좋아하는지 잘 모르겠어.\nA: (㉠)",
      choices:["모를 수도 있지. 괜찮아.","그럼 나랑 뜨개질부에 가입할래?","일단 나는 게임이랑 테니스를 좋아해.","그러면 다른 친구들이 좋아하는 걸 따라 해 보는 건 어때?","무엇을 할 때 즐거운지 알면 네가 무엇을 좋아하는지도 알 수 있을 거야. 관심 분야를 함께 찾아보자."],
      answer:4, explain:"자아 정체성은 자신의 성격, 능력, 관심 분야, 가치관 등을 이해하여 자신을 고유한 존재로 인식하는 것이다."
    }
  ];
  const quizForm = document.getElementById("quizForm");
  const totalCount = document.getElementById("totalCount");
  const btnGrade = document.getElementById("btnGrade");
  const btnShowAnswers = document.getElementById("btnShowAnswers");
  const btnReset = document.getElementById("btnReset");
  const btnScrollTop = document.getElementById("btnScrollTop");
  const resultBox = document.getElementById("resultBox");
  const resultTitle = document.getElementById("resultTitle");
  const resultMeta = document.getElementById("resultMeta");
  let graded = false;
  totalCount.textContent = quizData.length;
  function escapeHtml(str){
    return String(str)
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#39;");
  }
  function renderQuiz(){
    quizForm.innerHTML = "";
    quizData.forEach((item, idx) => {
      const wrap = document.createElement("div");
      wrap.className = "q";
      wrap.id = `q-${idx}`;
      const top = document.createElement("div");
      top.className = "q-top";
      const no = document.createElement("div");
      no.className = "q-no";
      no.textContent = item.no;
      const p = document.createElement("p");
      p.className = "q-text";
      p.textContent = item.q;
      top.appendChild(no);
      top.appendChild(p);
      wrap.appendChild(top);
      const choices = document.createElement("div");
      choices.className = "choices";
      item.choices.forEach((c, cIdx) => {
        const label = document.createElement("label");
        label.className = "choice";
        label.setAttribute("data-qidx", idx);
        label.setAttribute("data-cidx", cIdx);
        const input = document.createElement("input");
        input.type = "radio";
        input.name = `q_${idx}`;
        input.value = cIdx;
        const span = document.createElement("div");
        span.className = "c-text";
        span.textContent = `${circled[cIdx]} ${c}`;
        label.appendChild(input);
        label.appendChild(span);
        choices.appendChild(label);
      });
      wrap.appendChild(choices);
      const inline = document.createElement("div");
      inline.className = "inline-review";
      inline.id = `inline-${idx}`;
      wrap.appendChild(inline);
      quizForm.appendChild(wrap);
    });
  }
  function getUserAnswers(){
    return quizData.map((_, idx) => {
      const checked = document.querySelector(`input[name="q_${idx}"]:checked`);
      return checked ? Number(checked.value) : null;
    });
  }
  function clearHighlights(){
    document.querySelectorAll("label.choice").forEach(l => l.classList.remove("hl-correct","hl-wrong"));
  }
  function hideAllInlineReviews(){
    document.querySelectorAll(".inline-review").forEach(box => {
      box.style.display = "none";
      box.innerHTML = "";
    });
  }
  function findFirstUnanswered(user){
    return user.findIndex(v => v === null);
  }
  function grade(){
    const user = getUserAnswers();
    const firstUnanswered = findFirstUnanswered(user);
    if (firstUnanswered !== -1){
      alert("모든 문항을 풀어 주세요!\n미응답 문항이 있으면 채점이 진행되지 않습니다.");
      const el = document.getElementById(`q-${firstUnanswered}`);
      if (el) el.scrollIntoView({behavior:"smooth", block:"center"});
      return;
    }
    let correct = 0;
    user.forEach((u, idx) => { if (u === quizData[idx].answer) correct++; });
    const total = quizData.length;
    const score100 = Math.round((correct / total) * 100);
    graded = true;
    resultBox.style.display = "block";
    resultTitle.textContent = `점수: ${score100}점`;
    resultMeta.textContent = `정답 ${correct}/${total}`;
    btnShowAnswers.style.display = "inline-block";
    hideAllInlineReviews();
    clearHighlights();
    resultBox.scrollIntoView({behavior:"smooth", block:"start"});
  }
  function showAnswers(){
    if (!graded){
      alert("먼저 결과 확인하기로 채점해 주세요!");
      return;
    }
    const user = getUserAnswers();
    const firstUnanswered = findFirstUnanswered(user);
    if (firstUnanswered !== -1){
      alert("모든 문항을 풀어 주세요!\n미응답 문항이 있으면 채점이 진행되지 않습니다.");
      return;
    }
    clearHighlights();
    quizData.forEach((item, qIdx) => {
      const correctIdx = item.answer;
      const userIdx = user[qIdx];
      const correctLabel = document.querySelector(`label.choice[data-qidx="${qIdx}"][data-cidx="${correctIdx}"]`);
      if (correctLabel) correctLabel.classList.add("hl-correct");
      if (userIdx !== correctIdx){
        const wrongLabel = document.querySelector(`label.choice[data-qidx="${qIdx}"][data-cidx="${userIdx}"]`);
        if (wrongLabel) wrongLabel.classList.add("hl-wrong");
      }
      const inline = document.getElementById(`inline-${qIdx}`);
      const isCorrect = userIdx === correctIdx;
      const userTxt = `${circled[userIdx]} ${item.choices[userIdx]}`;
      const corTxt  = `${circled[correctIdx]} ${item.choices[correctIdx]}`;
      inline.innerHTML = `
        <div class="row">
          <div style="font-weight:900; letter-spacing:-.2px;">해설</div>
          <span class="badge ${isCorrect ? "good" : "bad"}">${isCorrect ? "정답" : "오답"}</span>
        </div>
        <div class="explain" style="margin-top:8px;">${escapeHtml(item.explain)}</div>
      `;
      inline.style.display = "block";
    });
  }
  function resetAll(){
    document.querySelectorAll('input[type="radio"]').forEach(r => r.checked = false);
    clearHighlights();
    hideAllInlineReviews();
    graded = false;
    resultBox.style.display = "none";
    btnShowAnswers.style.display = "none";
    window.scrollTo({top:0, behavior:"smooth"});
  }
  btnGrade.addEventListener("click", grade);
  btnShowAnswers.addEventListener("click", showAnswers);
  btnReset.addEventListener("click", resetAll);
  btnScrollTop.addEventListener("click", () => window.scrollTo({top:0, behavior:"smooth"}));
  renderQuiz();
</script>
</body>
</html>
